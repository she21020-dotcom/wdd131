<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="recipe.css">


<!-- Open Graph (Facebook, LinkedIn, etc.) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Your Title">
<meta property="og:description" content="Your Description">
<meta property="og:url" content="Your URL">
<meta property="og:image" content="social-preview-image.png">

<!-- X Card -->
<meta name="twitter:card" content="Social Preview Image">
<meta name="twitter:title" content="Your Title">
<meta name="twitter:description" content="Your Description">
<meta name="twitter:image" content="social-preview-image.png">

<!-- One favicon (ICO works everywhere) -->
<link rel="icon" href="/favicon.ico">

<!-- One Apple Touch Icon (iOS home screen) -->
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
</head>

<body>
  <main>
    <header class="book-main">
      <img src="images/recipe-book.png" alt="">
      <h1 id="recipe-book">RecipeBook</h1>
    </header>

    <form action="/search" method="GET" role="search">
      <input
        type="search"
        id="site-search"
        name="searchbar"
        placeholder="Find a recipe"
        aria-label="Find a recipe"
      >
      <button type="submit" aria-label="Search">
        <img src="images/search.svg" alt="">
      </button>
    </form>

    <article class="recipe-content">
      <img src="images/apple-crisp.jpg" alt="Apple crisp served with vanilla ice cream">
      <section>
        <p class="food-type"><strong>Dessert</strong></p>
        <h2 id="apple-crisp">Apple Crisp</h2>
        <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
        <p class="recipe-description">
          This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
        </p>
      </section>
    </article>
  </main>

  <footer>
    <div class="social">
      <a href="#" aria-label="Instagram"><img src="images/instagram_icon.svg" alt=""></a>
      <a href="#" aria-label="YouTube"><img src="images/youtube_icon.svg" alt=""></a>
      <a href="#" aria-label="Pinterest"><img src="images/pinterest_icon.svg" alt=""></a>
    </div>

    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
  </footer>
</body>
</html>
